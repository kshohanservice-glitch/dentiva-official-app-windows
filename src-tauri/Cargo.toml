[package]
name = "dentiva-pro"
version = "1.0.0"
description = "Dentiva Pro offline dental clinic management"
authors = ["Shohan Khan"]
edition = "2021"
rust-version = "1.77.2"
license = "Proprietary"

[lib]
name = "dentiva_pro_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.4.1", features = [] }

[dependencies]
tauri = { version = "2.8.5", features = [] }
tauri-plugin-dialog = "2.4.0"
tauri-plugin-fs = "2.4.2"
tauri-plugin-shell = "2.3.1"
serde = { version = "1.0.226", features = ["derive"] }
serde_json = "1.0.145"
rusqlite = { version = "0.37.0", features = ["bundled"] }
argon2 = { version = "0.5.3", features = ["std"] }
pbkdf2 = "0.12.2"
sha2 = "0.10.9"
subtle = "2.6.1"
rand = "0.9.2"
uuid = { version = "1.18.1", features = ["v4", "serde"] }
chrono = { version = "0.4.42", features = ["serde"] }
thiserror = "2.0.16"
zeroize = { version = "1.8.1", features = ["derive"] }
hex = "0.4.3"
directories = "6.0.0"
parking_lot = "0.12.4"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.60.2", features = ["Win32_Security_Cryptography", "Win32_System_Memory"] }

[dev-dependencies]
tempfile = "3.22.0"
