name: Release Dentiva Pro

on:
  workflow_dispatch:
    inputs:
      release_gate_evidence:
        description: Confirm BUILD_STATE records all gates PASS
        required: true
        type: choice
        options: [NOT_READY, ALL_GATES_PASS]
  push:
    tags: ['v1.0.0']

permissions:
  contents: write

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Enforce manual release gate
        if: github.event_name == 'workflow_dispatch' && inputs.release_gate_evidence != 'ALL_GATES_PASS'
        run: exit 1
      - name: Ensure no unresolved matrix status
        run: |
          test -f REQUIREMENTS_MATRIX.md
          ! grep -E '\| (PENDING|FAILED|NOT TESTED) \|' REQUIREMENTS_MATRIX.md

  build-windows:
    needs: gate
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci --ignore-scripts
      - run: npm audit --audit-level=high
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: cargo test --manifest-path src-tauri/Cargo.toml
      - run: npm run tauri build -- --bundles nsis
      - name: Generate SHA-256
        shell: pwsh
        run: |
          $file = Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe | Select-Object -First 1
          $hash = (Get-FileHash $file.FullName -Algorithm SHA256).Hash.ToLower()
          "$hash  $($file.Name)" | Out-File -Encoding ascii SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Dentiva-Pro-1.0.0-Windows
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            SHA256SUMS.txt
          if-no-files-found: error
      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: Dentiva Pro 1.0.0
          body_path: RELEASE_NOTES.md
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            SHA256SUMS.txt
